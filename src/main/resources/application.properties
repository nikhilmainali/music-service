# Server Port
server.port=8080

# Application Name
spring.application.name=music-service

# In-Memory H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:musicdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 Console - Access the database UI in your browser at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Swagger OpenAPI Documentation UI at http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
